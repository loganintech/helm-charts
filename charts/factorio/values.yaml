## @extra map_settings.path_finder.max_clients_to_accept_short_new_request Maximum clients to accept short pathfinding requests.
## @extra map_settings.path_finder.direct_distance_to_consider_short_request Direct distance to consider a pathfinding request as short.
## @extra map_settings.path_finder.short_request_max_steps Maximum steps for short pathfinding requests.
## @extra map_settings.path_finder.short_request_ratio Ratio for handling short pathfinding requests.
## @extra map_settings.path_finder.min_steps_to_check_path_find_termination Minimum steps before checking for pathfinding termination.
## @extra map_settings.path_finder.start_to_goal_cost_multiplier_to_terminate_path_find Cost multiplier for terminating pathfinding based on start-to-goal cost.
## @extra map_settings.path_finder.overload_levels Overload levels affecting pathfinding.
## @extra map_settings.path_finder.overload_multipliers Overload multipliers affecting pathfinding.
## @extra map_settings.path_finder.negative_path_cache_delay_interval Delay interval for negative pathfinding cache.
## @param map_settings.asteroids.spawning_rate Rate at which asteroids spawn.
## @param map_settings.asteroids.max_ray_portals_expanded_per_tick Maximum number of ray portals expanded per tick.
## @param map_settings.max_failed_behavior_count Maximum failed behavior count
