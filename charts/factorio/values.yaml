## @extra map_settings.steering.default.radius Radius for default steering behavior.
## @extra map_settings.steering.default.separation_force Separation force for default steering behavior.
## @extra map_settings.steering.default.separation_factor Separation factor for default steering behavior.
## @extra map_settings.steering.default.force_unit_fuzzy_goto_behavior Whether to force fuzzy behavior for default steering.
## @extra map_settings.steering.moving.radius Radius for moving steering behavior.
## @extra map_settings.steering.moving.separation_force Separation force for moving steering behavior.
## @extra map_settings.steering.moving.separation_factor Separation factor for moving steering behavior.
## @extra map_settings.steering.moving.force_unit_fuzzy_goto_behavior Whether to force fuzzy behavior for moving steering.
## @skip map_settings.path_finder
## @extra map_settings.path_finder [object] Override default pathfinder values. Check values.yaml to know what values you can override
## @extra map_settings.path_finder.fwd2bwd_ratio Forward-to-backward pathfinding ratio.
## @extra map_settings.path_finder.goal_pressure_ratio Goal pressure ratio for pathfinding.
## @extra map_settings.path_finder.max_steps_worked_per_tick Maximum steps worked per tick during pathfinding.
## @extra map_settings.path_finder.max_work_done_per_tick Maximum work done per tick during pathfinding.
## @extra map_settings.path_finder.use_path_cache Whether to use the pathfinding cache.
## @extra map_settings.path_finder.short_cache_size Size of the short pathfinding cache.
## @extra map_settings.path_finder.long_cache_size Size of the long pathfinding cache.
## @extra map_settings.path_finder.short_cache_min_cacheable_distance Minimum distance for caching short paths.
## @extra map_settings.path_finder.short_cache_min_algo_steps_to_cache Minimum algorithm steps to cache for short paths.
## @extra map_settings.path_finder.long_cache_min_cacheable_distance Minimum distance for caching long paths.
## @extra map_settings.path_finder.cache_max_connect_to_cache_steps_multiplier Maximum steps multiplier for connecting to cached paths.
## @extra map_settings.path_finder.cache_accept_path_start_distance_ratio Start distance ratio for accepting cached paths.
## @extra map_settings.path_finder.cache_accept_path_end_distance_ratio End distance ratio for accepting cached paths.
## @extra map_settings.path_finder.negative_cache_accept_path_start_distance_ratio Start distance ratio for accepting negative cached paths.
## @extra map_settings.path_finder.negative_cache_accept_path_end_distance_ratio End distance ratio for accepting negative cached paths.
## @extra map_settings.path_finder.cache_path_start_distance_rating_multiplier Start distance rating multiplier for cached paths.
## @extra map_settings.path_finder.cache_path_end_distance_rating_multiplier End distance rating multiplier for cached paths.
## @extra map_settings.path_finder.stale_enemy_with_same_destination_collision_penalty Penalty for stale enemy with the same destination.
## @extra map_settings.path_finder.ignore_moving_enemy_collision_distance Distance to ignore collision with moving enemies.
## @extra map_settings.path_finder.enemy_with_different_destination_collision_penalty Penalty for enemy with a different destination collision.
## @extra map_settings.path_finder.general_entity_collision_penalty General entity collision penalty.
## @extra map_settings.path_finder.general_entity_subsequent_collision_penalty Penalty for subsequent collisions with the same entity.
## @extra map_settings.path_finder.extended_collision_penalty Extended penalty for continuous collisions.
